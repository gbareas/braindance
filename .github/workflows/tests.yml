name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages (poppler for the PDF checks)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install the package
        run: python -m pip install .
      - name: Command-line entry points work
        run: |
          braindance-check --help
          braindance-figs --help
      - name: Check figure tests
        run: python tests/test_check_figure.py
        env:
          MPLBACKEND: Agg
      - name: Figure project tests
        run: python tests/test_figproject.py
        env:
          MPLBACKEND: Agg
      - name: Worked example runs and passes its checks
        run: python skills/latex-scientific-plots/example.py
        env:
          MPLBACKEND: Agg
